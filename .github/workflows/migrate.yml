name: Migrate

# Apply pending Supabase migrations on every push to main.
# The supabase CLI tracks applied migrations in supabase_migrations.schema_migrations,
# so re-running on a push that didn't change migrations is a safe no-op.
#
# Triggers:
#   - push to main (regardless of which files changed) — keeps the
#     schema in sync with whatever is on main, defensive against
#     one-off manual applys + forgotten CI.
#
# Setup required (one-time, in GitHub repo Settings → Secrets → Actions):
#   - SUPABASE_ACCESS_TOKEN  — https://supabase.com/account/tokens
#                              (Personal Access Token, "Generate new token")
#   - SUPABASE_PROJECT_ID    — Project Settings → General → Reference ID
#   - SUPABASE_DB_PASSWORD   — Project Settings → Database → Database password
#                              (set when the project was created; reset via
#                              "Reset database password" if lost)

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the Supabase CLI. Latest pinned release; bump manually
      # when a migration depends on a newer feature (e.g., new RLS
      # policy syntax). `version: latest` would also work but pinning
      # makes CI runs reproducible.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Link to the remote project + push pending migrations.
      # `--include-all` applies every *.sql in supabase/migrations/
      # that isn't yet recorded in supabase_migrations.schema_migrations.
      # The CLI's internal tracking handles idempotency — re-running on
      # an unchanged schema is a no-op (no migrations to apply).
      - name: Apply database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}